<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SG Automotive</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0B1A30">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SG Automotive">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Saira:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F7; --surface:#FFFFFF; --surface-2:#F5F7FB; --line:#D6DEE9; --text:#0E1A2B; --muted:#5A6B82;
  --blue:#0B6FE0; --blue-soft:rgba(11,111,224,.12); --red:#D4252F; --green:#1F9D6B; --amber:#C77C0A;
  --brand:#08131F; --brand-text:#E7ECF3;
  --metal:linear-gradient(180deg,#2B3B52 0%,#5B6B82 55%,#2B3B52 100%);
  --st-geplant:#8B9AB0; --st-gekauft:#5B6B82; --st-reparatur:#0B6FE0; --st-verkauf:#C77C0A; --st-verkauft:#1F9D6B;
  --shadow:0 1px 2px rgba(8,19,31,.06),0 6px 20px rgba(8,19,31,.06);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#081221; --surface:#0F1D31; --surface-2:#132439; --line:#22364F; --text:#E7ECF3; --muted:#8B9AB0;
    --blue:#3A93FF; --blue-soft:rgba(58,147,255,.16); --red:#F0444E; --green:#3DBE8B; --amber:#F2A93B;
    --metal:linear-gradient(180deg,#FFFFFF 0%,#AEB9C8 52%,#E6ECF3 100%);
    --st-geplant:#6E7E95; --st-gekauft:#C9D3E0; --st-reparatur:#3A93FF; --st-verkauf:#F2A93B; --st-verkauft:#3DBE8B;
    --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#081221; --surface:#0F1D31; --surface-2:#132439; --line:#22364F; --text:#E7ECF3; --muted:#8B9AB0;
  --blue:#3A93FF; --blue-soft:rgba(58,147,255,.16); --red:#F0444E; --green:#3DBE8B; --amber:#F2A93B;
  --metal:linear-gradient(180deg,#FFFFFF 0%,#AEB9C8 52%,#E6ECF3 100%);
  --st-geplant:#6E7E95; --st-gekauft:#C9D3E0; --st-reparatur:#3A93FF; --st-verkauf:#F2A93B; --st-verkauft:#3DBE8B;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px rgba(0,0,0,.25);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.5 "Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#0B1A30}
h1,h2,h3,.num{font-family:"Saira","Barlow",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* Brand bar */
.brand{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:radial-gradient(120% 220% at 18% 0%,#14284A 0%,#0B1A30 45%,#060E1A 100%);color:var(--brand-text);border-bottom:1px solid rgba(58,147,255,.35);box-shadow:0 1px 0 rgba(58,147,255,.25),0 8px 24px rgba(0,0,0,.25)}
.brand-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:8px 20px}
.brand img{height:58px;width:auto;display:block;filter:drop-shadow(0 0 14px rgba(58,147,255,.18))}
.tabs{display:flex;gap:4px;margin-left:auto}
.tab{background:none;border:0;color:#AEB9C8;padding:10px 14px;border-radius:8px;cursor:pointer;font-weight:500;font-size:15px;position:relative}
.tab:hover{color:#fff}
.tab[aria-current="page"]{color:#fff}
.tab[aria-current="page"]::after{content:"";position:absolute;left:14px;right:14px;bottom:2px;height:2px;border-radius:2px;background:#3A93FF;box-shadow:0 0 10px #3A93FF}
.sync{display:flex;align-items:center;gap:6px;font-size:13px;color:#AEB9C8;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#6E7E95}
.dot.on{background:#3DBE8B;box-shadow:0 0 8px #3DBE8B}
.dot.local{background:#F2A93B}

main{max-width:1180px;margin:0 auto;padding:24px 20px 110px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-head h1{font-size:30px;font-weight:600;margin:0;letter-spacing:.01em}
.page-head p{margin:2px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:9px;cursor:pointer;font-weight:600;font-size:15px}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--red)}
.btn.small{padding:6px 10px;font-size:14px}
.btn.ghost{background:none;border-color:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.panel-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);gap:12px}
.panel-h h2{font-size:18px;margin:0;font-weight:600}
.panel-b{padding:16px 18px}

/* Key figures: brushed metal numerals */
.figures{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:20px;box-shadow:var(--shadow)}
.fig{background:var(--surface);padding:18px 20px}
.fig span{display:block;color:var(--muted);font-size:14px}
.fig .num{font-size:30px;font-weight:700;line-height:1.15;background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.01em}
.fig small{color:var(--muted);font-size:13px}
.pos{color:var(--green)} .neg{color:var(--red)}

.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:start}
.stack{display:grid;gap:20px;align-content:start}

.hero{position:relative;border-radius:18px;overflow:hidden;margin-bottom:18px;padding:14px 20px 12px;display:grid;place-items:center;
  background:radial-gradient(90% 120% at 50% 0%,#17305A 0%,#0B1A30 48%,#050C17 100%);border:1px solid rgba(58,147,255,.28);box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;inset:auto 0 0;height:1px;background:linear-gradient(90deg,transparent,#3A93FF,transparent);opacity:.7}
.hero img{width:min(290px,100%);height:auto;display:block;filter:drop-shadow(0 0 24px rgba(58,147,255,.22))}
@media (max-width:820px){.hero{padding:10px 10px 8px}.hero img{width:min(230px,80%)}}
/* Pipeline */
.pipeline{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.stage{border-radius:10px;padding:12px;background:var(--surface-2);border-top:3px solid var(--c)}
.stage b{display:block;font-family:"Saira",sans-serif;font-size:26px;line-height:1}
.stage span{font-size:13px;color:var(--muted)}

.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:2px 9px;border-radius:999px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}

/* Lists */
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:12px;align-items:center;padding:11px 18px;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.when{font-family:"Saira",sans-serif;font-weight:600;font-size:14px;min-width:62px;color:var(--blue)}
.grow{flex:1;min-width:0}
.sub{color:var(--muted);font-size:14px}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:10px}

/* Vehicle cards */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.search{flex:1;min-width:180px;max-width:320px;padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface)}
.cars{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.car{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:16px;cursor:pointer;box-shadow:var(--shadow);display:grid;gap:10px;border-left:4px solid var(--c)}
.car:hover{border-color:var(--blue);border-left-color:var(--c)}
.car h3{margin:0;font-size:19px;font-weight:600;line-height:1.2}
.car .meta{color:var(--muted);font-size:14px}
.car dl{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0}
.car dt{font-size:12px;color:var(--muted)} .car dd{margin:0;font-weight:600;font-size:15px}

.lnk{color:var(--blue);font-weight:600;text-decoration:none;word-break:break-all}
.lnk:hover{text-decoration:underline}
/* Bilder */
.cover{margin:-16px -16px 0 -16px;aspect-ratio:16/9;background:var(--surface-2);overflow:hidden;border-radius:10px 10px 0 0}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;padding:14px 18px 18px}
.thumb{position:relative;aspect-ratio:4/3;border:1px solid var(--line);border-radius:10px;overflow:hidden;padding:0;background:var(--surface-2);cursor:zoom-in}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.first::after{content:"Titelbild";position:absolute;left:6px;top:6px;font-size:11px;font-weight:700;background:rgba(5,12,23,.75);color:#fff;padding:2px 7px;border-radius:6px}
img.broken{opacity:0}
.thumb:has(img.broken)::before,.cover:has(img.broken)::before{content:"Bild nicht verfügbar";position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:var(--muted)}
.cover:has(img.broken){position:relative}
.uploading{display:flex;align-items:center;justify-content:center;aspect-ratio:4/3;border:1px dashed var(--blue);border-radius:10px;color:var(--blue);font-size:13px;font-weight:600;text-align:center;padding:6px}
.drop{border:1px dashed var(--line);border-radius:10px;margin:14px 18px 18px;padding:22px;text-align:center;color:var(--muted)}
#lb{width:min(1100px,calc(100vw - 16px));background:#050C17;border-color:#1B2D47;color:#E7ECF3}
.lb-img{display:grid;place-items:center;background:#050C17;max-height:calc(100dvh - 150px);position:relative}
.lb-img img{max-width:100%;max-height:calc(100dvh - 150px);object-fit:contain;display:block}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(5,12,23,.7);border:1px solid #22364F;color:#fff;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.lb-nav svg{width:20px;height:20px}
.lb-prev{left:10px}.lb-next{right:10px}
#lb .dlg-h,#lb .dlg-f{background:#050C17;border-color:#1B2D47}
#lb .btn{background:#0F1D31;border-color:#22364F;color:#E7ECF3}
#lb .btn.danger{color:#F0444E}
/* Benutzer, Aktivität */
.userchip{background:rgba(58,147,255,.14);border:1px solid rgba(58,147,255,.4);color:#E7ECF3;border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.userchip:hover{background:rgba(58,147,255,.25)}
.by{font-size:12px;color:var(--muted);margin-top:2px}
.stamp{font-size:13px;color:var(--muted);margin-top:8px}
.act li{align-items:flex-start}
.act .who{font-weight:700}
.act .t{font-size:12px;color:var(--muted);white-space:nowrap;margin-left:auto;padding-left:8px}
.avatar{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;background:var(--c,#3A93FF)}
.gate{max-width:420px;margin:40px auto}
.gate .panel-b{display:grid;gap:12px}
.gate h1{font-size:24px;margin:0}
.gate p{margin:0;color:var(--muted)}
.namepick{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:820px){.brand .sync{display:none}.userchip{max-width:120px}}
/* Teile */
.partrow{display:grid;grid-template-columns:1.2fr 1.4fr 64px 90px 108px 36px;grid-template-areas:'n l m p mo d';gap:6px;align-items:center;margin-bottom:6px}
.p-name{grid-area:n}.p-link{grid-area:l}.p-menge{grid-area:m}.p-preis{grid-area:p}.p-modus{grid-area:mo;padding:7px 6px!important}.p-del{grid-area:d}
.partrow input{padding:7px 9px}
.parts .actions{grid-column:1/-1;align-items:center}
.parts{grid-template-columns:1fr!important}
.parts-list{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;margin-top:4px}
@media (max-width:820px){.partrow{grid-template-columns:64px 1fr 1.2fr 36px;grid-template-areas:'n n n d' 'l l l l' 'm p mo mo';padding-bottom:8px;border-bottom:1px solid var(--line)}}
/* Zeitraum-Auswahl */
.rng{grid-column:1/-1;display:grid;gap:6px}
.rng-l{font-size:14px;color:var(--muted);font-weight:500}
.rng-btn{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;text-align:left;border:1px solid var(--line);border-left:4px solid var(--pc);background:var(--surface-2);border-radius:9px;padding:10px 12px;font-size:16px;cursor:pointer;color:var(--text)}
.rng-btn .ph{color:var(--muted)}
.rng-btn .warn{color:var(--red);font-size:13px;font-weight:600;width:100%}
.rng-btn .chev{margin-left:auto;color:var(--muted)}
.rng-cal{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface);max-width:430px;box-shadow:var(--shadow)}
.cal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.cal-h b{font-family:"Saira",sans-serif;font-weight:600}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);row-gap:3px}
.cal-g .wd{font-size:12px;color:var(--muted);text-align:center;padding:4px 0;font-weight:600}
.cal-d{position:relative;height:42px;border:0;background:none;border-radius:8px;cursor:pointer;font-size:15px;color:var(--text);padding:0}
.cal-d:hover:not([disabled]){background:var(--blue-soft)}
.cal-d.in{background:color-mix(in srgb,var(--pc) 22%,transparent);border-radius:0}
.cal-d.s,.cal-d.e{background:var(--pc);color:#fff;font-weight:700}
.cal-d.s{border-radius:8px 0 0 8px}.cal-d.e{border-radius:0 8px 8px 0}.cal-d.s.e{border-radius:8px}
.cal-d.today{box-shadow:inset 0 0 0 1.5px var(--red)}
.cal-d[disabled]{opacity:.3;cursor:not-allowed}
.pm{position:absolute;left:5px;right:5px;bottom:4px;height:4px;border-radius:2px;background:var(--m)}
.km{position:absolute;top:4px;right:5px;width:7px;height:7px;transform:rotate(45deg);background:var(--text)}
.cal-f{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.cal-f .chip{padding:4px 10px;font-size:13px}
.cal-leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin-top:8px;align-items:center}
.cal-leg span{display:inline-flex;align-items:center;gap:5px}
/* Datei-Knöpfe: Eingabefeld liegt unsichtbar über dem Knopf (zuverlässiger am Handy) */
label.btn{position:relative;overflow:hidden}
.file-ov{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0;padding:0;border:0;z-index:1}
.wv-note{margin:12px 18px 0;padding:10px 12px;border-radius:10px;font-size:14px;background:color-mix(in srgb,var(--amber) 14%,transparent);border:1px solid color-mix(in srgb,var(--amber) 40%,transparent);display:grid;gap:8px}
a.btn{text-decoration:none}
/* Dokumente */
.docs{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
.doc-slot{background:var(--surface);padding:14px 18px;display:grid;gap:10px;align-content:start}
.doc-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.doc-h .btn{margin-left:auto}
.doc-list{display:grid;gap:8px}
.doc{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:6px;background:var(--surface-2)}
.doc-prev{flex:none;padding:0;cursor:zoom-in;width:56px;height:56px;border-radius:7px;overflow:hidden;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--red);text-decoration:none}
.doc-prev img{width:100%;height:100%;object-fit:cover;display:block}
.pdf{display:grid;place-items:center;gap:0}
.pdf svg{width:24px;height:24px}
.pdf b{font-size:10px;letter-spacing:.06em}
.doc-meta{flex:1;min-width:0;display:grid;font-size:14px}
.doc-meta span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.doc-empty{border:1px dashed var(--line);border-radius:10px;padding:14px;text-align:center;color:var(--muted);font-size:14px}
@media (max-width:820px){.docs{grid-template-columns:1fr}}
/* Änderungsverlauf (standardmäßig zugeklappt) */
.act-h{width:100%;background:none;border:0;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;color:var(--text);font:inherit;gap:12px}
.act-panel.closed .act-h{border-bottom:0}
.act-panel.closed > :not(.act-h){display:none}
.act-h h2{white-space:nowrap;flex:none}
.act-last{margin-left:auto;flex:1;min-width:0;text-align:right;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act-h .chev{color:var(--muted);font-size:14px}
/* Phase abgeschlossen */
.phase-chk{display:flex;align-items:center;gap:7px;margin-top:8px;font-size:14px;color:var(--text);cursor:pointer;font-weight:500}
.phase-chk input{width:18px;height:18px;padding:0;margin:0;accent-color:var(--green);flex:none}
/* Rechnungen */
.belege{font-size:13px;margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.lnk-btn{background:none;border:0;padding:0;cursor:pointer;font:inherit;font-size:13px}
.beleg{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid var(--line);font-size:14px}
.beleg.removed span{text-decoration:line-through;opacity:.5}
/* Reparaturen */
.rep-list .rep{align-items:flex-start}
.chk{width:28px;height:28px;border-radius:8px;border:2px solid var(--muted);background:none;color:transparent;display:grid;place-items:center;cursor:pointer;flex:none;margin-top:1px;font-weight:700}
.chk:hover{border-color:var(--green)}
.rep.done .chk{background:var(--green);border-color:var(--green);color:#fff}
.rep.done b{text-decoration:line-through;color:var(--muted)}
.rep.skip b{text-decoration:line-through;color:var(--muted)}
.rep.skip .chk{background:var(--muted);border-color:var(--muted);color:#fff}
.rep.skip .vals{opacity:.7}
.skipb{display:inline-block;font-size:12px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 8px;margin-left:6px;vertical-align:middle}
.vals{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-top:2px}
.vals em{font-style:normal;color:var(--text);font-weight:600}
.over{color:var(--red)!important}.under{color:var(--green)!important}
.progress{height:6px;background:var(--surface-2);border-radius:4px;overflow:hidden;margin:12px 18px 2px}
.progress i{display:block;height:100%;background:var(--green);box-shadow:0 0 8px var(--green)}
.rep-sum{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.rep-sum b{color:var(--text)}
.hint{font-size:14px;background:var(--blue-soft);border-radius:9px;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
/* Akte */
.back{margin-bottom:12px}
.akte-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.akte-head h1{margin:0;font-size:30px;font-weight:600;line-height:1.15}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px 20px}
.facts dt{font-size:13px;color:var(--muted)} .facts dd{margin:0;font-weight:600;white-space:pre-line}
.phase{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line)}
.phase>div{background:var(--surface);padding:14px 18px}
.phase h3{font-size:15px;margin:0 0 6px;font-weight:600;display:flex;align-items:center;gap:8px}
.phase h3 i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.phase p{margin:0;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:13px;padding:10px 18px;border-bottom:1px solid var(--line)}
td{padding:10px 18px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{font-weight:700;border-top:2px solid var(--line)}
.scroll-x{overflow-x:auto}
.notes{white-space:pre-wrap}
.pl{display:grid;gap:6px;font-variant-numeric:tabular-nums}
.pl div{display:flex;justify-content:space-between;gap:12px}
.pl .total{border-top:2px solid var(--line);padding-top:8px;font-weight:700;font-size:18px}

/* Planung / Gantt */
.gantt-nav{display:flex;align-items:center;gap:8px}
.gantt-nav b{font-family:"Saira",sans-serif;font-weight:600;min-width:170px;text-align:center}
.gantt{overflow-x:auto}
.g-inner{min-width:760px;position:relative}
.g-row{display:grid;grid-template-columns:var(--lw,190px) 1fr;border-bottom:1px solid var(--line)}
.g-row:last-child{border-bottom:0}
.g-label{padding:10px 14px;position:sticky;left:0;background:var(--surface);z-index:2;border-right:1px solid var(--line);cursor:pointer;min-width:0}
.g-label b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-label span{font-size:13px;color:var(--muted)}
.g-track{position:relative;min-height:54px;cursor:pointer}
.g-htrack{cursor:default;display:flex;flex-direction:column;min-height:34px!important}
.g-htrack .g-months{height:auto;flex:1}
.g-months{display:flex;height:100%}
.g-month{border-left:1px solid var(--line);white-space:nowrap;font-size:13px;color:var(--muted);padding:8px 8px;font-weight:600}
.g-head .g-label{cursor:default;font-size:13px;color:var(--muted);font-weight:600}
.g-grid{position:absolute;inset:0;display:flex;pointer-events:none}
.g-grid span{position:absolute;top:0;bottom:0;border-left:1px solid var(--line)}
.g-grid .wk{opacity:.45;border-left-style:dashed}
.g-grid .mo{opacity:1}
.g-weeks{position:relative;height:30px;border-top:1px solid var(--line)}
.g-weeks span{position:absolute;top:0;bottom:0;border-left:1px dashed var(--line);padding:3px 0 0 5px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;line-height:1.15}
.g-weeks small{display:block;font-weight:500;font-size:11px}
.plan-h{flex-wrap:wrap}
.seg{display:flex;gap:6px}
.gantt.detail .g-track{min-height:64px}
.gantt.detail .bar{height:28px;line-height:28px;font-size:13px;border-radius:7px}
.gantt.detail .mark{width:16px;height:16px}
.bar{position:absolute;top:50%;height:20px;transform:translateY(-50%);border-radius:5px;font-size:12px;font-weight:600;color:#fff;line-height:20px;white-space:nowrap}
.bar span{position:sticky;left:calc(var(--lw,190px) + 4px);display:inline-block;max-width:100%;padding:0 6px;overflow:hidden;text-overflow:ellipsis;vertical-align:top}
.g-row:not(.g-head) .today::after{display:none}
.bar.rep{background:var(--st-reparatur);box-shadow:0 0 12px color-mix(in srgb,var(--st-reparatur) 55%,transparent)}
.bar.ver{background:var(--st-verkauf);color:#1a1205}
.bar.auf{background:#13B5A6;color:#04211e}
.mark{position:absolute;top:50%;width:13px;height:13px;transform:translate(-50%,-50%) rotate(45deg);border:2px solid var(--surface);z-index:1}
.mark.kauf{background:var(--text)} .mark.sold{background:var(--st-verkauft)} .mark.hu{background:var(--red)} .mark.cost{background:#E05FB0}
.mlabel.low{top:auto;bottom:3px}
.mlabel{position:absolute;top:3px;transform:translateX(9px);font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap;pointer-events:none;z-index:2}
 .mark.rp{background:var(--st-reparatur);border-radius:50%;width:10px;height:10px;transform:translate(-50%,-50%)}
.plan-h .seg + .seg{margin-left:4px;padding-left:10px;border-left:1px solid var(--line)}
.today{position:absolute;top:0;bottom:0;width:2px;background:var(--red);z-index:3;pointer-events:none}
.today::after{content:"Heute";position:absolute;top:-2px;left:4px;font-size:11px;font-weight:700;color:var(--red)}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--muted);padding:12px 18px;border-top:1px solid var(--line)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:18px;height:10px;border-radius:3px}
.legend i.d{width:10px;height:10px;transform:rotate(45deg);border-radius:0}

/* Dialog */
dialog{border:1px solid var(--line);border-radius:16px;padding:0;background:var(--surface);color:var(--text);width:min(680px,calc(100vw - 24px));max-height:calc(100dvh - 40px);box-shadow:0 30px 80px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(4,10,18,.6);backdrop-filter:blur(2px)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.dlg-h h2{margin:0;font-size:20px;font-weight:600}
.dlg-b{padding:16px 20px;display:grid;gap:18px}
.dlg-f{display:flex;justify-content:space-between;gap:8px;padding:14px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
fieldset{border:0;padding:0;margin:0;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
legend{font-family:"Saira",sans-serif;font-weight:600;font-size:15px;margin-bottom:8px;color:var(--blue)}
label{display:grid;gap:4px;font-size:14px;color:var(--muted);font-weight:500}
label.full{grid-column:1/-1}
input,select,textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:16px;color:var(--text);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:transparent}
textarea{min-height:90px;resize:vertical}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--brand);color:#fff;padding:10px 16px;border-radius:10px;font-weight:500;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.35);opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.notice{background:color-mix(in srgb,var(--amber) 14%,transparent);border:1px solid color-mix(in srgb,var(--amber) 40%,transparent);padding:10px 14px;border-radius:10px;margin-bottom:16px;font-size:15px}

/* Mobile */
.bottom-nav{display:none}
@media (max-width:820px){
  .tabs,.brand .sync-wide{display:none}
  .brand img{height:44px}
  .brand-in{padding:6px 14px;justify-content:space-between}
  main{padding:16px 14px 110px}
  .page-head h1,.akte-head h1{font-size:25px}
  .figures{grid-template-columns:repeat(2,1fr)}
  .fig{padding:14px}
  .fig .num{font-size:23px}
  .grid2{grid-template-columns:1fr}
  .pipeline{grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
  .stage{padding:9px 6px} .stage b{font-size:20px} .stage span{font-size:11px}
  .phase{grid-template-columns:1fr}
  fieldset{grid-template-columns:1fr}
  .g-label{padding:10px 10px}
  .g-label b{font-size:14px;white-space:normal;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .gantt-nav b{min-width:0;font-size:14px}
  .plan-h{padding:12px}
  .legend{gap:10px 14px;font-size:13px}
  .gantt{-webkit-overflow-scrolling:touch}
  /* Formulare als Vollbild, Feld bleibt sichtbar */
  #dlg{width:100%;max-width:100%;height:var(--vvh,100dvh);max-height:var(--vvh,100dvh);margin:0;top:var(--vvt,0px);left:0;border-radius:0;border:0;position:fixed}
  #dlg form{display:flex;flex-direction:column;height:100%}
  #dlg .dlg-h{padding-top:calc(12px + env(safe-area-inset-top,0px))}
  #dlg .dlg-b{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-bottom:40vh}
  #dlg .dlg-f{padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  th,td{padding:9px 12px}
  .bottom-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--brand);border-top:1px solid rgba(58,147,255,.35);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .bottom-nav button{background:none;border:0;color:#8B9AB0;display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:600;padding:4px 0;cursor:pointer}
  .bottom-nav button svg{width:22px;height:22px}
  .bottom-nav button[aria-current="page"]{color:#fff}
  .bottom-nav button[aria-current="page"] svg{color:#3A93FF;filter:drop-shadow(0 0 6px #3A93FF)}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
(() => {
'use strict';

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eurF = new Intl.NumberFormat('de-DE', {style:'currency', currency:'EUR', maximumFractionDigits:0});
const eur = n => eurF.format(Number(n) || 0);
const eurS = n => (n > 0 ? '+' : '') + eur(n);
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : 0; };
const pd = s => { if (!s) return null; const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fd = s => { const d = pd(s); return d ? d.toLocaleDateString('de-DE', {day:'2-digit', month:'2-digit', year:'numeric'}) : '–'; };
const fds = s => { const d = pd(s); return d ? d.toLocaleDateString('de-DE', {day:'2-digit', month:'short'}) : '–'; };
const days = (a, b) => { const x = pd(a), y = pd(b); return x && y ? Math.round((y - x) / 864e5) : null; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const todayISO = () => iso(new Date());
const signCls = n => n > 0 ? 'pos' : n < 0 ? 'neg' : '';

const STATUS = {
  geplant:   {label:'Geplant',      c:'var(--st-geplant)'},
  gekauft:   {label:'Gekauft',      c:'var(--st-gekauft)'},
  reparatur: {label:'In Reparatur', c:'var(--st-reparatur)'},
  verkauf:   {label:'Im Verkauf',   c:'var(--st-verkauf)'},
  verkauft:  {label:'Verkauft',     c:'var(--st-verkauft)'}
};
const badge = st => { const s = STATUS[st] || STATUS.geplant; return `<span class="badge" style="--c:${s.c}">${s.label}</span>`; };
const REP_CATS = ['Mechanik','Bremsen','Motor & Getriebe','Fahrwerk','Elektrik','Karosserie','Lack','Reifen & Räder','Innenraum','Aufbereitung','TÜV-Vorbereitung','Sonstiges'];
const COST_CATS = ['Teile','Werkstatt','Lack & Karosserie','TÜV & Zulassung','Transport','Reinigung & Aufbereitung','Inserate','Sonstiges'];

const postenSum = v => (v.kosten || []).reduce((a, k) => a + num(k.betrag), 0);

function repRecords() {

  return out;
}

  return {n: list.length, kosten: avg(ks), stunden: avg(hs), minK: ks.length ? Math.min(...ks) : null, maxK: ks.length ? Math.max(...ks) : null, minH: hs.length ? Math.min(...hs) : null, maxH: hs.length ? Math.max(...hs) : null};

function finance() {
  const sumE = t => S.entries.filter(e => e.typ === t).reduce((a, e) => a + num(e.betrag), 0);
  const einlagen = sumE('einlage'), entnahmen = sumE('entnahme'), ausgaben = sumE('ausgabe'), einnahmen = sumE('einnahme');
  const T = tradeCars();
  const paid = T.filter(isBought);
  const sold = T.filter(isSold), open = T.filter(v => isBought(v) && !isSold(v));
  const kaufSum = paid.reduce((a, v) => a + num(v.kaufpreis), 0);
  const kostenSum = paid.reduce((a, v) => a + costSum(v), 0);
  const fzEinlage = T.filter(v => v.herkunft === 'privat' && isBought(v)).reduce((a, v) => a + num(v.kaufpreis), 0);
  const behalten = S.vehicles.filter(v => isOwn(v) && v.ausHandel), behaltenSum = behalten.reduce((a, v) => a + (has(v.handelInvest) ? num(v.handelInvest) : investOf(v)), 0);
  const erloese = sold.reduce((a, v) => a + num(v.verkaufspreis), 0);
  const werkzeug = S.tools.filter(t => t.status === 'gekauft').reduce((a, t) => a + num(t.preis), 0);
  const werkzeugPlan = S.tools.filter(t => t.status !== 'gekauft').reduce((a, t) => a + num(t.preis), 0);
  const fahrzeugPlan = T.filter(v => v.status === 'geplant').reduce((a, v) => a + num(v.kaufpreis), 0);
  const kasse = einlagen + fzEinlage - entnahmen + einnahmen - ausgaben + erloese - kaufSum - kostenSum - werkzeug - behaltenSum;
  const gebunden = open.reduce((a, v) => a + investOf(v), 0);
  const realisiert = sold.reduce((a, v) => a + profitOf(v), 0);
  const erwartet = open.filter(v => num(v.zielpreis) > 0).reduce((a, v) => a + expectedOf(v), 0);
  const ergebnis = realisiert + einnahmen - ausgaben - werkzeug;
  return {fzEinlage, behalten, behaltenSum, einlagen, entnahmen, ausgaben, einnahmen, kaufSum, kostenSum, erloese, werkzeug, werkzeugPlan, fahrzeugPlan, kasse, gebunden, realisiert, erwartet, ergebnis, sold, open};
}

function renderCars() {

function repairsHTML(v) {
  const rank = r => r.entfallen ? 2 : r.erledigt ? 1 : 0;
  const list = reps(v).slice().sort((a, b) => rank(a) - rank(b));
  const done = list.filter(r => r.erledigt).length, skipped = list.filter(r => r.entfallen).length;
  const btn = `<button class="btn small primary" data-act="new-rep" data-id="${v.id}" data-needs-write>${ICON.plus}Reparatur</button>`;
  if (!list.length) return `<section class="panel"><div class="panel-h"><h2>Reparaturen</h2>${btn}</div><div class="empty">Noch keine Reparaturen geplant. Lege eine Checkliste an – bekannte Reparaturen bekommen automatisch erwartete Kosten und Dauer.</div></section>`;
  const row = r => {
    const dk = r.erledigt && has(r.istKosten) && has(r.planKosten) ? num(r.istKosten) - num(r.planKosten) : null;
    const dh = r.erledigt && has(r.istStunden) && has(r.planStunden) ? num(r.istStunden) - num(r.planStunden) : null;
    return `<li class="rep${r.entfallen ? ' skip' : r.erledigt ? ' done' : ''}"><button class="chk" data-act="rep-toggle" data-id="${v.id}" data-rep="${r.id}" aria-pressed="${!!(r.erledigt || r.entfallen)}" aria-label="${esc(r.titel)} ${r.erledigt || r.entfallen ? 'wieder öffnen' : 'als erledigt markieren'}" data-needs-write>${r.entfallen ? '–' : '✓'}</button>
      <div class="grow"><b>${esc(r.titel)}</b>${r.entfallen ? '<span class="skipb">nicht benötigt</span>' : ''}<div class="vals">
        ${r.kategorie ? `<span>${esc(r.kategorie)}</span>` : ''}
        <span>erwartet <em>${has(r.planKosten) ? eur(r.planKosten) : '–'}</em> · <em>${has(r.planStunden) ? fh(num(r.planStunden)) : '–'}</em></span>
        ${r.erledigt ? `<span>tatsächlich <em class="${dk > 0 ? 'over' : dk < 0 ? 'under' : ''}">${has(r.istKosten) ? eur(r.istKosten) : '–'}</em> · <em class="${dh > 0 ? 'over' : dh < 0 ? 'under' : ''}">${has(r.istStunden) ? fh(num(r.istStunden)) : '–'}</em>${r.datum ? ' · ' + fds(r.datum) : ''}</span>` : ''}
      </div>${partsHTML(r)}${r.notiz ? `<div class="sub">${esc(r.notiz)}</div>` : ''}${byLine(r)}</div>
      <div class="actions" style="flex-direction:column;align-items:flex-end;gap:2px">${!r.erledigt && !r.entfallen ? `<button class="btn small ghost" data-act="rep-skip" data-id="${v.id}" data-rep="${r.id}" data-needs-write title="Reparatur wird doch nicht gebraucht">Entfällt</button>` : ''}
      <button class="btn small ghost" data-act="edit-rep" data-id="${v.id}" data-rep="${r.id}" data-needs-write>Ändern</button></div></li>`;
  };
  return `<section class="panel"><div class="panel-h"><h2>Reparaturen</h2><div class="actions"><span class="sub" style="align-self:center">${done} / ${list.length - skipped} erledigt${skipped ? ` · ${skipped} entfallen` : ''}</span>${btn}</div></div>
    <div class="progress"><i style="width:${list.length - skipped ? done / (list.length - skipped) * 100 : 100}%"></i></div>
    <ul class="list rep-list">${list.map(row).join('')}</ul>
    <div class="rep-sum"><span>Offen erwartet: <b>${eur(repOpen(v))}</b> · <b>${fh(hOpen(v))}</b></span><span>Erledigt: <b>${eur(repIst(v))}</b> · <b>${fh(hIst(v))}</b></span></div></section>`;
}

async function uploadDocs(vid, typ, files) {
  files = [...files].filter(f => f.type === 'application/pdf' || /\.pdf$/i.test(f.name) || f.type.startsWith('image/') || /\.(heic|heif|jpe?g|png|webp)$/i.test(f.name));
  if (!files.length || !S.assets) return;
  const key = vid + ':' + typ;
  S.uploading[key] = (S.uploading[key] || 0) + files.length; render();
  const added = []; let failed = 0;
  for (const f of files) {
    try {
      const pdf = f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
      let b = f, type = 'application/pdf';
      if (!pdf) { b = await shrinkDoc(f); type = /^image\/(jpeg|png|webp)$/.test(b.type) ? b.type : 'image/jpeg'; }
      const cv = S.vehicles.find(x => x.id === vid) || {}, sk = vid + ':' + typ; S.seq = S.seq || {}; const k = S.seq[sk] = Math.max(S.seq[sk] || 0, docsOf(cv, typ).length) + 1;
      const r = await S.assets.upload(b, {type, vid, name: DOC_SHORT[typ] + (k > 1 ? ' ' + k : '')});
      added.push({id: r.id, typ, pdf, name: DOC_SHORT[typ] + (k > 1 ? ' ' + k : ''), at: new Date().toISOString()});
    } catch (e) {
      failed++;
      if (e && e.code === 'too_large') toast('Datei zu groß (max. 20 MB).');
      else if (e && e.code === 'unsupported_type') toast('Format nicht unterstützt – bitte PDF oder JPG.');
      else if (e && e.code === 'quota_exceeded') toast('Speicher voll.');
    }
    S.uploading[key]--; render();
  }
  if (added.length) {
    const cur = S.vehicles.find(x => x.id === vid);
    if (cur) await Store.save('vehicles', {...cur, dokumente: [...(cur.dokumente || []), ...added]});
    toast(`${DOC_SHORT[typ]} gespeichert`);
  } else if (failed) toast('Hochladen fehlgeschlagen.');
}
async function shrinkDoc(file) {
  try {
    const bmp = await createImageBitmap(file, {imageOrientation: 'from-image'});
    const sc = Math.min(1, 2600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height); bmp.close && bmp.close();
    return (await new Promise(r => c.toBlob(r, 'image/jpeg', 0.9))) || file;
  } catch (e) { return file; }
}
/* Dateiauswahl direkt am Eingabefeld binden: so kommt die Auswahl auch dann an,
   wenn die Seite neu gezeichnet wurde, während die Auswahl am Handy offen war. */
function bindUploads() {
  document.querySelectorAll('#app input[data-upload]').forEach(i => { i.onchange = () => { const f = [...i.files]; i.value = ''; if (f.length) uploadImages(i.dataset.upload, f); }; });

}

async function shrink(file) {
  if (!/^image\/(jpeg|png|webp)$/.test(file.type) && file.type !== '') {
    // andere Formate (z. B. HEIC) versuchen wir zu dekodieren, sonst Original
  }
  try {
    const bmp = await createImageBitmap(file, {imageOrientation: 'from-image'});
    const max = 2000, sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
    if (sc === 1 && file.type === 'image/jpeg' && file.size < 1.5e6) { bmp.close && bmp.close(); return file; }
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    bmp.close && bmp.close();
    const out = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
    return out || file;
  } catch (e) { return file; }
}

async function uploadImages(vid, files) {
  files = [...files].filter(f => f.type.startsWith('image/') || /\.(heic|heif|jpe?g|png|webp)$/i.test(f.name));
  if (!files.length || !S.assets) return;
  S.uploading[vid] = (S.uploading[vid] || 0) + files.length; render();
  const added = []; let failed = 0;
  for (const f of files) {
    try {
      const b = await shrink(f);
      const type = /^image\/(jpeg|png|webp|gif)$/.test(b.type) ? b.type : 'image/jpeg';
      const cv = S.vehicles.find(x => x.id === vid) || {}; S.seq = S.seq || {}; const n = S.seq[vid] = Math.max(S.seq[vid] || 0, imgs(cv).length) + 1;
      const r = await S.assets.upload(b, {type, vid, name: 'Bild ' + String(n).padStart(2, '0')});
      added.push({id: r.id, at: new Date().toISOString()});
    } catch (e) {
      failed++;
      if (e && e.code === 'unsupported_type') toast('Dieses Bildformat wird nicht unterstützt – bitte als JPG speichern.');
      else if (e && e.code === 'quota_exceeded') toast('Bildspeicher voll – bitte alte Bilder löschen.');
    }
    S.uploading[vid]--; render();
  }
  if (added.length) {
    const cur = S.vehicles.find(x => x.id === vid);
    if (cur) await Store.save('vehicles', {...cur, bilder: [...imgs(cur), ...added]});
  }
  if (failed && failed === files.length) toast('Hochladen fehlgeschlagen.');
  else toast(added.length === 1 ? 'Bild hinzugefügt' : added.length + ' Bilder hinzugefügt');
}

const PHASES = [

  {from: 'aufbereitungStart', to: 'aufbereitungEnde', c: '#13B5A6', l: 'Aufbereitung'},

const MIN_LABEL = {kaufdatum: 'dem Kauf', reparaturEnde: 'dem Reparaturende', aufbereitungEnde: 'dem Ende der Aufbereitung'};
const fVal = n => { const f = $('#dlgform'); const i = f && f.elements[n]; return i ? i.value : ''; };
function rngMin(el) { for (const n of (el.dataset.min || '').split(',').filter(Boolean)) { const v = fVal(n); if (v) return {d: v, n}; } return null; }
function rangeField(f, val) {
  const [a, b] = val || [];
  const ph = PHASES.find(p => p.from === f.from) || PHASES[0];
  return `<div class="rng full" data-from="${f.from}" data-to="${f.to}" data-min="${(f.min || []).join(',')}" style="--pc:${ph.c}">
    <input type="hidden" name="${f.from}" value="${esc(a || '')}"><input type="hidden" name="${f.to}" value="${esc(b || '')}">
    <span class="rng-l">${f.l}</span><button type="button" class="rng-btn"></button><div class="rng-cal" hidden></div></div>`;
}
function rngText(el) {
  const a = fVal(el.dataset.from), b = fVal(el.dataset.to), m = rngMin(el);
  let t = !a ? '<span class="ph">Zeitraum im Kalender wählen</span>' : `<span>${fd(a)} – ${b ? fd(b) : '<span class="ph">Ende wählen</span>'}</span>${b ? `<span class="sub">${days(a, b)} Tage</span>` : ''}`;
  if (a && m && a < m.d) t += `<span class="warn">⚠ beginnt vor ${MIN_LABEL[m.n] || 'der vorherigen Phase'}</span>`;
  el.querySelector('.rng-btn').innerHTML = t + '<span class="chev">▾</span>';
}
function refreshRanges() { document.querySelectorAll('#dlgform .rng').forEach(el => { rngText(el); if (!el.querySelector('.rng-cal').hidden) drawCal(el); }); }
function drawCal(el) {
  const cal = el.querySelector('.rng-cal'), st = el._st;
  const a = fVal(el.dataset.from), b = fVal(el.dataset.to), m = rngMin(el), kauf = fVal('kaufdatum'), today = todayISO();
  const y = st.view.getFullYear(), mo = st.view.getMonth();
  const first = new Date(y, mo, 1), lead = (first.getDay() + 6) % 7, nd = new Date(y, mo + 1, 0).getDate();
  const others = PHASES.filter(p => p.from !== el.dataset.from).map(p => ({...p, a: fVal(p.from), b: fVal(p.to)})).filter(p => p.a);
  let cells = '';
  for (let i = 0; i < lead; i++) cells += '<span></span>';
  for (let d = 1; d <= nd; d++) {
    const iso = `${y}-${String(mo + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const dis = m && iso < m.d;
    const cls = ['cal-d'];
    if (a && iso === a) cls.push('s');
    if ((b && iso === b) || (a && !b && iso === a)) cls.push('e');
    if (a && b && iso > a && iso < b) cls.push('in');
    if (iso === today) cls.push('today');
    const o = others.find(p => iso >= p.a && iso <= (p.b || p.a));
    cells += `<button type="button" class="${cls.join(' ')}" data-day="${iso}" ${dis ? 'disabled' : ''} aria-label="${fd(iso)}${o ? ', ' + o.l : ''}">${d}${o ? `<i class="pm" style="--m:${o.c}"></i>` : ''}${iso === kauf ? '<i class="km" title="Kauf"></i>' : ''}</button>`;
  }

  cal.innerHTML = `<div class="cal-h"><button type="button" class="btn small ghost" data-cal="-1" aria-label="Vorheriger Monat">${ICON.left}</button>

    <div class="cal-g">${['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'].map(w => `<span class="wd">${w}</span>`).join('')}${cells}</div>
    <div class="cal-f"><span class="sub" style="margin-right:auto">${hint}</span>
      ${a ? [[3, '3 T'], [7, '1 Wo'], [14, '2 Wo'], [28, '4 Wo']].map(([n, l]) => `<button type="button" class="chip" data-dur="${n}">${l}</button>`).join('') : ''}
      ${a ? '<button type="button" class="btn small ghost" data-cal="clear">Leeren</button>' : ''}<button type="button" class="btn small" data-cal="done">Fertig</button></div>
    <div class="cal-leg">${m ? `<span>frühestens ${fd(m.d)} (nach ${MIN_LABEL[m.n] || 'vorheriger Phase'})</span>` : ''}${kauf ? '<span><i class="km" style="position:static;display:inline-block"></i> Kauf</span>' : ''}${others.map(p => `<span><i class="pm" style="--m:${p.c};position:static;display:inline-block;width:14px"></i> ${p.l}</span>`).join('')}</div>`;
}
function openCal(el) {
  document.querySelectorAll('#dlgform .rng-cal').forEach(c => { if (c.parentElement !== el) c.hidden = true; });
  const a = fVal(el.dataset.from), m = rngMin(el);

  el._st = {view: new Date(base.getFullYear(), base.getMonth(), 1)};

function setRange(el, a, b) {

document.addEventListener('click', e => {

/* PS ↔ kW: 1 PS = 0,73549875 kW · 1 kW = 1,35962 PS */
const PS_KW = 0.73549875;

  const ti = $('#f_titel'), pk = $('#f_planKosten'), ph = $('#f_planStunden'), hint = $('#rephint');

    if (st.stunden != null && (force || auto(ph))) { ph.value = Math.round(st.stunden * 4) / 4; ph.dataset.auto = '1'; }
  };
  const upd = () => {
    const st = repStats(ti.value, v);

    hint.innerHTML = `<span>Ø aus ${st.n} Reparatur${st.n === 1 ? '' : 'en'}${st.same ? ' am ' + esc(vName(v)) : ''}: <b>${st.kosten == null ? '–' : eur(st.kosten)}</b> · <b>${fh(st.stunden)}</b>${st.n > 1 && st.minK != null && st.minK !== st.maxK ? ` <span class="sub">(${eur(st.minK)} – ${eur(st.maxK)})</span>` : ''}</span><button type="button" class="btn small" id="useexp">Übernehmen</button>`;

    if (!r && !finish) fill(st, false);
  };
  ti.addEventListener('input', upd); ti.addEventListener('change', upd); upd();
  bindParts();

async function uploadBelege(vid, cid, files) {
  if (!files.length || !S.assets) return;
  const key = 'beleg:' + cid; S.uploading[key] = (S.uploading[key] || 0) + files.length; render();
  const added = [];
  for (const f of files) {
    try {
      const pdf = f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
      let b = f, type = 'application/pdf';
      if (!pdf) { b = await shrinkDoc(f); type = /^image\/(jpeg|png|webp)$/.test(b.type) ? b.type : 'image/jpeg'; }
      const cv = S.vehicles.find(x => x.id === vid) || {}, ck = (cv.kosten || []).find(k => k.id === cid) || {};
      S.seq = S.seq || {}; const n = S.seq[key] = Math.max(S.seq[key] || 0, (ck.belege || []).length) + 1;
      const r = await S.assets.upload(b, {type, vid, name: cleanName0('Rechnung ' + (ck.text || 'Kosten') + (n > 1 ? ' ' + n : ''))});
      added.push({id: r.id, pdf, name: f.name.replace(/\.[^.]+$/, '').slice(0, 60), at: new Date().toISOString()});
    } catch (e) { toast(e && e.code === 'too_large' ? 'Datei zu groß (max. 20 MB).' : 'Rechnung konnte nicht hochgeladen werden.'); }
    S.uploading[key]--; render();
  }
  if (!added.length) return;
  const cur = S.vehicles.find(x => x.id === vid); if (!cur) return;
  const ck = (cur.kosten || []).find(k => k.id === cid);
  await Store.save('vehicles', {...cur, kosten: (cur.kosten || []).map(k => k.id === cid ? {...k, belege: [...(k.belege || []), ...added]} : k)},
    `hat ${added.length === 1 ? 'eine Rechnung' : added.length + ' Rechnungen'} zu „${ck ? ck.text : 'Kosten'}“ bei ${vName(cur)} angehängt`);
  toast(added.length === 1 ? 'Rechnung gespeichert' : added.length + ' Rechnungen gespeichert');
}

document.addEventListener('click', e => {

    case 'keep-car': return confirmBox(`${vName(v)} behalten?`, 'Das Fahrzeug wandert zu den eigenen Fahrzeugen. Kauf und Kosten bleiben in der Kasse verbucht, es zählt aber nicht mehr zum Bestand.', 'Behalten').then(ok => {
      if (!ok) return; const cur = S.vehicles.find(x => x.id === id) || v;
      Store.save('vehicles', {...cur, art: 'eigen', ausHandel: isBought(cur), handelInvest: isBought(cur) ? investOf(cur) : '', behaltenAm: todayISO()}, `hat ${vName(cur)} behalten (jetzt eigenes Fahrzeug)`); toast('Zu eigenen Fahrzeugen verschoben');
    });
    case 'edit-car': return carForm(v);
    case 'del-car': return confirmBox('Fahrzeugakte löschen?').then(ok => { if (ok) { if (S.assets && v) [...imgs(v), ...docsOf(v), ...(v.kosten || []).flatMap(k => k.belege || [])].forEach(b => S.assets.delete(b.id).catch(() => {})); Store.remove('vehicles', id); go('fahrzeuge'); toast('Gelöscht'); } });
    case 'new-cost': return costForm(v);
    case 'new-rep': return repForm(v);
    case 'edit-rep': return repForm(v, reps(v).find(r => r.id === t.dataset.rep));
    case 'rep-toggle': {
      const r = reps(v).find(x => x.id === t.dataset.rep); if (!r) return;
      if (!r.erledigt && !r.entfallen) return repForm(v, r, true);
      Store.save('vehicles', {...v, reparaturen: reps(v).map(x => x.id === r.id ? {...x, erledigt: false, entfallen: false} : x)}, `hat Reparatur „${r.titel}“ bei ${vName(v)} wieder geöffnet`); return toast('Wieder offen');
    }
    case 'rep-skip': {
      const r = reps(v).find(x => x.id === t.dataset.rep); if (!r) return;
      Store.save('vehicles', {...v, reparaturen: reps(v).map(x => x.id === r.id ? {...x, entfallen: true, erledigt: false} : x)}, `hat Reparatur „${r.titel}“ bei ${vName(v)} als nicht benötigt markiert`); return toast('Als nicht benötigt markiert');
    }
    case 'del-doc': return confirmBox('Dokument löschen?').then(ok => {
      if (!ok) return; const cur = S.vehicles.find(x => x.id === id) || v;
      Store.save('vehicles', {...cur, dokumente: (cur.dokumente || []).filter(d => d.id !== t.dataset.doc)});
      if (S.assets) S.assets.delete(t.dataset.doc).catch(() => {}); toast('Dokument gelöscht');
    });
    case 'edit-cost': return costForm(v, (v.kosten || []).find(c => c.id === t.dataset.cost));
    case 'new-entry': return entryForm();
    case 'edit-entry': return entryForm(S.entries.find(x => x.id === id));
    case 'new-tool': return toolForm();
    case 'edit-tool': return toolForm(S.tools.find(x => x.id === id));
    case 'buy-tool': { const tl = S.tools.find(x => x.id === id); Store.save('tools', {...tl, status: 'gekauft', datum: tl.datum || todayISO()}); return toast('Ins Inventar übernommen'); }
  }
});
let searchT;
document.addEventListener('input', e => {
  if (e.target.id !== 'search') return;
  S.q = e.target.value; clearTimeout(searchT);
  searchT = setTimeout(() => { const pos = e.target.selectionStart; render(); const s = $('#search'); if (s) { s.focus(); try { s.setSelectionRange(pos, pos); } catch (x) {} } }, 180);
});
let rw; window.addEventListener('resize', () => { clearTimeout(rw); rw = setTimeout(() => { if (S.view === 'planung' && !S.akte) render(); }, 200); });

/* ---------- Mobile: Eingabefeld mittig halten ---------- */
const vv = window.visualViewport;
function syncVV() {
  if (!vv) return;
  document.documentElement.style.setProperty('--vvh', vv.height + 'px');
  document.documentElement.style.setProperty('--vvt', vv.offsetTop + 'px');
}
function centerField(el) {
  if (!el || window.innerWidth >= 820) return;
  const box = el.closest('.dlg-b'); if (!box) return;
  const target = el.closest('label') || el;
  const r = target.getBoundingClientRect(), b = box.getBoundingClientRect();
  box.scrollTo({top: box.scrollTop + (r.top - b.top) - (b.height - r.height) / 2, behavior: 'smooth'});
}
if (vv) { vv.addEventListener('resize', () => { syncVV(); const a = document.activeElement; if (a && a.closest && a.closest('#dlg')) setTimeout(() => centerField(a), 60); }); vv.addEventListener('scroll', syncVV); syncVV(); }
$('#dlg').addEventListener('focusin', e => { const el = e.target; if (el.matches('input,select,textarea')) setTimeout(() => centerField(el), 320); });

/* ---------- Name ---------- */
function setName(n) { S.me = n; try { localStorage.setItem('sg-name', n); } catch (e) {} setSync(); render(); }
document.addEventListener('submit', e => {
  if (e.target.id !== 'namegate') return; e.preventDefault();
  const n = e.target.name.value.trim(); if (n) setName(n);
});
document.addEventListener('click', e => {
  const p = e.target.closest('[data-pick]'); if (!p) return;
  const i = document.querySelector('#namegate input[name=name]'); if (i) i.value = p.dataset.pick;
});
function openSettings() {
  const form = $('#dlgform'), dlg = $('#dlg');
  form.innerHTML = `<div class="dlg-h"><h2>Einstellungen</h2><button type="button" class="btn small ghost" data-close aria-label="Schließen">✕</button></div>
    <div class="dlg-b">
      <fieldset><legend>Dein Name</legend><label class="full">Wird bei deinen Einträgen und Änderungen angezeigt<input id="setname" maxlength="30" value="${esc(S.me)}"></label></fieldset>
      <fieldset><legend>Google Drive</legend><div class="full sub">${readToken() ? 'Verbunden' : 'Nicht verbunden'}${S.lastSync ? ' · zuletzt synchronisiert ' + relTime(S.lastSync) : ''}</div>
        <div class="actions full"><a class="btn small" href="https://drive.google.com/drive/folders/${esc(folderId())}" target="_blank" rel="noopener">Ordner in Drive öffnen</a>
        <button type="button" class="btn small" id="syncbtn">Jetzt synchronisieren</button><button type="button" class="btn small" id="chfolder">Ordner wechseln</button></div></fieldset>
      <fieldset><legend>Daten</legend><div class="actions full">
        <button type="button" class="btn small" id="exp">Sicherung herunterladen (JSON)</button>
        <label class="btn small">Daten importieren (JSON)<input type="file" id="imp" accept="application/json,.json" class="file-ov"></label></div>
        <p class="sub full" style="margin:0">Der Import ergänzt die vorhandenen Daten, er löscht nichts.</p></fieldset>
      <fieldset><legend>Konto</legend><div class="actions full"><button type="button" class="btn small danger" id="logout">Von Google abmelden</button></div></fieldset>
    </div>
    <div class="dlg-f"><span></span><div class="actions"><button type="button" class="btn" data-close>Schließen</button><button type="button" class="btn primary" id="savename">Speichern</button></div></div>`;
  form.onsubmit = ev => ev.preventDefault();
  form.querySelectorAll('[data-close]').forEach(b => b.onclick = () => dlg.close());
  $('#savename').onclick = () => { const n = $('#setname').value.trim(); if (n) setName(n); dlg.close(); };
  $('#syncbtn').onclick = () => { dlg.close(); if (!readToken()) return connectGoogle(); syncNow(); toast('Synchronisiere …'); };
  $('#chfolder').onclick = () => { dlg.close(); lsSet('sg-folder', null); Sync.dataId = null; Sync.version = null; carsFolderP = null; S.phase = readToken() ? 'folder' : 'connect'; render(); };
  $('#logout').onclick = () => { dlg.close(); lsSet('sg-token', null); setSync(); render(); toast('Abgemeldet – Daten bleiben auf dem Gerät'); };
  $('#exp').onclick = () => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(snapshot(), null, 1)], {type: 'application/json'}));
    a.download = `sg-automotive-sicherung-${todayISO()}.json`; document.body.appendChild(a); a.click(); a.remove();
  };
  $('#imp').onchange = async ev => {
    const file = ev.target.files[0]; if (!file) return;
    try {
      const d = JSON.parse(await file.text()); let n = 0;
      const claudeId = /^[0-9a-f]{32}$/;
      for (const c of COLS) (d[c] || []).forEach(o => { if (!o || !o.id) return; n++; o.updatedAt = o.updatedAt || new Date().toISOString();
        if (c === 'vehicles') { o.bilder = (o.bilder || []).filter(b => b && !claudeId.test(b.id)); o.dokumente = (o.dokumente || []).filter(b => b && !claudeId.test(b.id)); } });
      mergeIn({vehicles: d.vehicles || [], tools: d.tools || [], entries: d.entries || [], activity: d.activity || [], deleted: {}});
      logActivity(`hat ${n} Einträge importiert`, 'import', ''); markDirty(); dlg.close(); render(); toast(n + ' Einträge importiert');
    } catch (err) { toast('Import fehlgeschlagen: Datei ungültig'); }
  };
  dlg.showModal();
}
$('#userchip').addEventListener('click', openSettings);

/* ---------- Start ---------- */
const h0 = (location.hash || '').slice(1);
if (VIEWS.some(v => v.id === h0)) S.view = h0;
loadLocal();
boot();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
